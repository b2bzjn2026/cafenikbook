<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | کافه کتاب نیک</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Vazirmatn, sans-serif; background: #0e0d0c; color: #f6f4f0; min-height: 100vh; }
    .tab-btn.active { background: #f59e0b; color: #000; font-weight: 800; }
  </style>
</head>
<body class="p-4 pb-16">
  <main class="max-w-2xl mx-auto py-6">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-black text-amber-400">پنل مدیریت کافه کتاب نیک</h1>
      <p class="text-xs text-stone-400 mt-1.5">مدیریت محصولات، قیمت‌ها و گروه‌های منو</p>
    </header>

    <p id="status" role="status" class="text-xs mb-4 text-center min-h-[1.25rem]"></p>

    <!-- پنل ورود -->
    <section id="login-panel" class="bg-stone-900 border border-amber-500/20 rounded-2xl p-6 max-w-md mx-auto">
      <h2 class="font-bold text-lg mb-4">ورود مدیر</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs text-stone-300 mb-1.5">ایمیل مدیر</label>
          <input id="email" type="email" autocomplete="username" required class="w-full rounded-xl bg-stone-800 border border-stone-700 p-3 text-sm text-white focus:border-amber-500 focus:outline-none" placeholder="admin@example.com">
        </div>
        <div>
          <label class="block text-xs text-stone-300 mb-1.5">رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" required class="w-full rounded-xl bg-stone-800 border border-stone-700 p-3 text-sm text-white focus:border-amber-500 focus:outline-none" placeholder="رمز عبور">
        </div>
        <button class="w-full rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold p-3 text-sm transition" type="submit">ورود به پنل مدیریت</button>
      </form>
    </section>

    <!-- پنل اصلی مدیریت (فقط دو بخش منو و تنظیمات) -->
    <section id="manager-panel" class="hidden space-y-5">
      <div class="flex items-center justify-between bg-stone-900/90 border border-stone-800 p-2 rounded-2xl">
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="switchTab('menu')" id="tab-menu" class="tab-btn active px-4 py-2 rounded-xl text-xs transition">محصولات و گروه‌ها</button>
          <button type="button" onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-4 py-2 rounded-xl text-xs text-stone-300 hover:bg-stone-800 transition">اطلاعات کافه</button>
        </div>
        <button id="logout" type="button" class="text-xs text-red-400 hover:text-red-300 px-3 py-1.5 rounded-lg border border-red-500/20">خروج</button>
      </div>

      <!-- تب ۱: مدیریت منو و گروه‌ها -->
      <div id="view-menu" class="space-y-5">
        <div class="bg-stone-900 border border-amber-500/30 rounded-2xl p-4">
          <button type="button" id="toggle-add-btn" class="w-full flex items-center justify-between text-right font-bold text-sm text-amber-400">
            <span>+ افزودن آیتم یا گروه جدید به منو</span>
            <span id="toggle-add-icon" class="text-lg">+</span>
          </button>

          <form id="add-item-form" class="hidden mt-4 pt-4 border-t border-stone-800 space-y-3 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-stone-300 mb-1">نام محصول *</label>
                <input id="new-title" type="text" required placeholder="مثلاً: چیزبرگر زغالی / پاستا" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
              </div>
              <div>
                <label class="block text-stone-300 mb-1">نام گروه یا دسته‌بندی (انگلیسی یا فارسی) *</label>
                <input id="new-category" type="text" required placeholder="مثلاً: fastfood یا fast-food" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
                <p class="text-[10px] text-stone-400 mt-0.5">اگر گروه جدید بنویسید، خودکار در سایت ایجاد می‌شود.</p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-stone-300 mb-1">قیمت (تومان) *</label>
                <input id="new-price" type="number" min="0" step="1000" required placeholder="مثلاً: 180000" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white text-left">
              </div>
              <div>
                <label class="block text-stone-300 mb-1">برچسب ویژه (اختیاری)</label>
                <input id="new-badge" type="text" placeholder="مثلاً: پرفروش، غذای گرم، ویژه" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
              </div>
            </div>

            <div>
              <label class="block text-stone-300 mb-1">توضیحات کوتاه محصول</label>
              <input id="new-desc" type="text" placeholder="توضیح مواد اولیه یا ترکیبات..." class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
            </div>

            <div>
              <label class="block text-stone-300 mb-1">لینک یا نام فایل تصویر (اختیاری)</label>
              <input id="new-image" type="text" placeholder="مثلاً نام عکس در گیت‌هاب یا لینک اینترنتی" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white text-left">
            </div>

            <button type="submit" class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold p-3 text-sm transition">
              ثبت و اضافه کردن به منو
            </button>
          </form>
        </div>

        <div class="flex items-center justify-between">
          <h2 class="font-bold text-sm text-stone-200">لیست محصولات منو (<span id="items-count">0</span>)</h2>
        </div>
        <div id="items" class="space-y-3"></div>
      </div>

      <!-- تب ۲: تنظیمات و اطلاعات کافه -->
      <div id="view-settings" class="hidden bg-stone-900 border border-amber-500/20 rounded-2xl p-5">
        <h2 class="font-bold text-base text-amber-400 mb-4">ویرایش اطلاعات و متن‌های سایت</h2>
        <form id="settings-form" class="space-y-3.5 text-xs">
          <div>
            <label class="block text-stone-300 mb-1">شعار زیر لوگو</label>
            <input id="set-tagline" type="text" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
          </div>
          <div>
            <label class="block text-stone-300 mb-1">متن بج وضعیت بالای صفحه</label>
            <input id="set-status-badge" type="text" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
          </div>
          <div>
            <label class="block text-stone-300 mb-1">متن کادر معرفی / اطلاعیه کافه</label>
            <textarea id="set-announcement" rows="3" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white"></textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-stone-300 mb-1">شماره تماس</label>
              <input id="set-phone" type="text" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white text-left">
            </div>
            <div>
              <label class="block text-stone-300 mb-1">نشانی کافه</label>
              <input id="set-address" type="text" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2.5 text-white">
            </div>
          </div>
          <button type="submit" class="w-full rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold p-3 text-sm transition">
            ذخیره اطلاعات کافه
          </button>
        </form>
      </div>
    </section>

    <a href="./index.html" class="block text-center text-amber-400 hover:underline text-xs mt-8">مشاهده صفحه اصلی منوی کافه ←</a>
  </main>

  <script>
    const SUPABASE_URL = 'https://nandayycunxhlwpemvno.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yEmf0-1PWxJ0poGaXxaSeg_fuhO7YOD';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setStatus(message, isError = false) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = 'text-xs mb-4 text-center min-h-[1.25rem] ' + (isError ? 'text-red-400' : 'text-emerald-400');
    }

    function switchTab(tab) {
      ['menu', 'settings'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      });
    }

    document.getElementById('toggle-add-btn').addEventListener('click', () => {
      const form = document.getElementById('add-item-form');
      const icon = document.getElementById('toggle-add-icon');
      const isHidden = form.classList.toggle('hidden');
      icon.textContent = isHidden ? '+' : '−';
    });

    async function initDashboard() {
      document.getElementById('login-panel').classList.add('hidden');
      document.getElementById('manager-panel').classList.remove('hidden');
      await Promise.all([loadItems(), loadSettings()]);
    }

    async function loadItems() {
      setStatus('در حال دریافت لیست محصولات...');
      const { data, error } = await db.from('menu_items').select('*').order('sort_order', { ascending: true });
      if (error) return setStatus('خطا: ' + error.message, true);

      document.getElementById('items-count').textContent = data.length;
      const container = document.getElementById('items');
      container.replaceChildren();

      data.forEach(item => {
        const title = item.title || item.id;
        const isAvailable = item.is_available !== false;

        const card = document.createElement('div');
        card.className = 'bg-stone-900 border border-stone-800 rounded-2xl p-4 space-y-3';

        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex-1 min-w-[160px]">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-white">${escapeHtml(title)}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-stone-800 text-amber-300">گروه: ${escapeHtml(item.category || 'general')}</span>
                ${!isAvailable ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-red-500/20 text-red-300">ناموجود</span>' : ''}
              </div>
              <p class="text-[11px] text-stone-400 mt-1">${escapeHtml(item.description || '')}</p>
            </div>
            <div class="flex items-center gap-2">
              <input type="number" step="1000" id="p-${item.id}" value="${item.price}" class="w-28 rounded-xl bg-stone-800 border border-stone-700 p-2 text-sm text-white text-left">
              <button type="button" onclick="savePrice('${item.id}', document.getElementById('p-${item.id}').value)" class="rounded-xl bg-amber-500 text-black font-bold px-3 py-2 text-xs">ذخیره</button>
              <button type="button" onclick="document.getElementById('edit-${item.id}').classList.toggle('hidden')" class="rounded-xl bg-stone-800 text-stone-200 px-3 py-2 text-xs">ویرایش</button>
            </div>
          </div>
          <form id="edit-${item.id}" class="hidden pt-3 border-t border-stone-800 space-y-3 text-xs" onsubmit="updateItem(event, '${item.id}')">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div><label class="text-stone-400">نام محصول</label><input name="title" type="text" required value="${escapeAttr(title)}" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2 text-white mt-1"></div>
              <div><label class="text-stone-400">نام گروه / دسته‌بندی</label><input name="category" type="text" required value="${escapeAttr(item.category || 'coffee')}" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2 text-white mt-1"></div>
            </div>
            <div><label class="text-stone-400">توضیحات</label><input name="description" type="text" value="${escapeAttr(item.description || '')}" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2 text-white mt-1"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div><label class="text-stone-400">برچسب ویژه</label><input name="badge" type="text" value="${escapeAttr(item.badge || '')}" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2 text-white mt-1"></div>
              <div><label class="text-stone-400">لینک تصویر</label><input name="image_url" type="text" value="${escapeAttr(item.image_url || '')}" class="w-full rounded-xl bg-stone-800 border border-stone-700 p-2 text-white text-left mt-1"></div>
            </div>
            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 cursor-pointer"><input name="is_available" type="checkbox" ${isAvailable ? 'checked' : ''} class="rounded bg-stone-800 text-amber-500"><span class="text-stone-200">موجود در منو</span></label>
              <div class="flex items-center gap-2">
                <button type="button" onclick="deleteItem('${item.id}')" class="rounded-xl bg-red-500/20 text-red-300 px-3 py-2 font-bold">حذف</button>
                <button type="submit" class="rounded-xl bg-emerald-500 text-black px-4 py-2 font-bold">ذخیره تغییرات</button>
              </div>
            </div>
          </form>
        `;
        container.append(card);
      });
      setStatus('لیست منو بارگذاری شد.');
    }

    async function savePrice(id, newPrice) {
      const price = Number(newPrice);
      const { error } = await db.from('menu_items').update({ price }).eq('id', id);
      if (error) return setStatus('خطا در ذخیره قیمت: ' + error.message, true);
      setStatus('قیمت با موفقیت ذخیره شد.');
    }

    async function updateItem(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const updates = {
        title: fd.get('title').trim(),
        category: fd.get('category').trim().toLowerCase(),
        description: fd.get('description').trim(),
        badge: fd.get('badge').trim(),
        image_url: fd.get('image_url').trim(),
        is_available: e.target.querySelector('[name="is_available"]').checked
      };
      const { error } = await db.from('menu_items').update(updates).eq('id', id);
      if (error) return setStatus('خطا: ' + error.message, true);
      setStatus('محصول با موفقیت ویرایش شد.');
      loadItems();
    }

    async function deleteItem(id) {
      if (!confirm('آیا مطمئن هستید؟')) return;
      const { error } = await db.from('menu_items').delete().eq('id', id);
      if (error) return setStatus('خطا: ' + error.message, true);
      setStatus('محصول حذف شد.');
      loadItems();
    }

    document.getElementById('add-item-form').addEventListener('submit', async e => {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const category = document.getElementById('new-category').value.trim().toLowerCase();
      const price = Number(document.getElementById('new-price').value);
      const badge = document.getElementById('new-badge').value.trim();
      const description = document.getElementById('new-desc').value.trim();
      const image_url = document.getElementById('new-image').value.trim();

      const id = 'item-' + Date.now();
      const { error } = await db.from('menu_items').insert({ id, title, category, price, badge, description, image_url, is_available: true, sort_order: 50 });
      if (error) return setStatus('خطا: ' + error.message, true);

      e.target.reset();
      document.getElementById('add-item-form').classList.add('hidden');
      document.getElementById('toggle-add-icon').textContent = '+';
      setStatus(`محصول «${title}» به گروه «${category}» اضافه شد!`);
      loadItems();
    });

    async function loadSettings() {
      const { data } = await db.from('cafe_settings').select('*').eq('id', 1).maybeSingle();
      if (!data) return;
      document.getElementById('set-tagline').value = data.tagline || '';
      document.getElementById('set-status-badge').value = data.status_badge || '';
      document.getElementById('set-announcement').value = data.announcement || '';
      document.getElementById('set-phone').value = data.phone || '';
      document.getElementById('set-address').value = data.address || '';
    }

    document.getElementById('settings-form').addEventListener('submit', async e => {
      e.preventDefault();
      const updates = {
        tagline: document.getElementById('set-tagline').value.trim(),
        status_badge: document.getElementById('set-status-badge').value.trim(),
        announcement: document.getElementById('set-announcement').value.trim(),
        phone: document.getElementById('set-phone').value.trim(),
        address: document.getElementById('set-address').value.trim()
      };
      const { error } = await db.from('cafe_settings').update(updates).eq('id', 1);
      if (error) return setStatus('خطا: ' + error.message, true);
      setStatus('اطلاعات کافه ذخیره شد.');
    });

    function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    function escapeAttr(str) { return escapeHtml(str); }

    db.auth.getSession().then(({ data }) => { if (data.session) initDashboard(); });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      setStatus('در حال ورود...');
      const { error } = await db.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
      if (error) return setStatus('ایمیل یا رمز عبور اشتباه است.', true);
      initDashboard();
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await db.auth.signOut();
      document.getElementById('manager-panel').classList.add('hidden');
      document.getElementById('login-panel').classList.remove('hidden');
    });
  </script>
</body>
</html>
